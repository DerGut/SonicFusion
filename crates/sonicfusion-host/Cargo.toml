[package]
name = "sonicfusion-host"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Runs SonicFusion graph specs: validation, lowering, live sessions and probes"

[features]
default = ["audio-device"]
audio-device = ["sonicfusion/audio-device"]

[dependencies]
datafusion = "=54.1.0"
futures = "=0.3.31"
sonicfusion = { path = "../.." }
sonicfusion-graph-api = { path = "../sonicfusion-graph-api" }
thiserror = "=2.0.20"
tokio = { version = "=1.52.4", features = ["macros", "rt-multi-thread", "sync", "time"] }

[dev-dependencies]
serde_json = "=1.0.151"
