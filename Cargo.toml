[package]
name = "sonicfusion"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

[features]
audio-device = ["dep:cpal", "dep:rtrb", "tokio/signal", "tokio/time"]

[[example]]
name = "live_play"
required-features = ["audio-device"]

[dependencies]
async-stream = "=0.3.6"
cpal = { version = "=0.18.2", optional = true }
datafusion = "=54.1.0"
futures = "=0.3.31"
hound = "=3.5.1"
rtrb = { version = "=0.4.1", optional = true }
tempfile = "=3.20.0"
thiserror = "=2.0.20"
tokio = { version = "=1.52.4", features = ["macros", "rt-multi-thread", "sync"] }
